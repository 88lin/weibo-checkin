<svg xmlns="http://www.w3.org/2000/svg" width="880" height="280" viewBox="0 0 880 280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1a2e"/>
      <stop offset="0.55" stop-color="#16213e"/>
      <stop offset="1" stop-color="#e94560"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9f43"/>
      <stop offset="1" stop-color="#e94560"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="872" height="272" rx="28" fill="url(#bg)"/>
  <rect x="4" y="4" width="872" height="272" rx="28" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.8"/>

  <!-- 超话圈层图形：三个交叠的圆 = 超话社区 + 签到对勾 -->
  <g transform="translate(150,140)">
    <circle cx="-30" cy="0" r="62" fill="#ff9f43" opacity="0.38"/>
    <circle cx="18" cy="-14" r="62" fill="#e94560" opacity="0.42"/>
    <circle cx="38" cy="14" r="62" fill="#4e8cff" opacity="0.40"/>
    <circle cx="4" cy="0" r="52" fill="#16213e" stroke="#ff9f43" stroke-width="3"/>
    <path d="M -18 2 L -4 16 L 26 -16" fill="none" stroke="#34d399" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 标题 -->
  <text x="330" y="122" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
        font-size="52" font-weight="700" fill="#f5f5f5">weibo-checkin</text>
  <rect x="332" y="142" width="180" height="5" rx="2.5" fill="url(#accent)"/>

  <!-- 副标题 -->
  <text x="332" y="190" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
        font-size="25" fill="#d8d8e2">微博超话每日自动签到 · 评论互动</text>
  <text x="332" y="230" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
        font-size="20" fill="#9aa3b8">纯标准库 · 零依赖 · 防风控 · Cookie 体检 · 失败通知</text>
</svg>
